      body {
        background: var(--dark-bg);
        color: var(--text-primary);
        position: relative;
      }
      
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--ambient-background);
        z-index: -2;
      }
      
      /* Убираем градиентный фон когда применяется анимированный фон */
      body.anime-background::after {
        display: none !important;
      }
      
      body.presidents-background::after {
        display: none !important;
      }
      
      /* Исправление проблемы с перекрытием выпадающих меню */
      .container-fluid {
        position: relative;
        z-index: 1;
      }
      
      /* Обеспечиваем, что выпадающие меню отображаются поверх всего */
      [style*="z-index: 9999"] {
        position: relative !important;
        z-index: 9999 !important;
      }
      
      /* Навигационная панель должна иметь высокий z-index */
      .MuiAppBar-root {
        z-index: 9998 !important;
      }
      
      /* Выпадающие меню в навигации */
      .MuiAppBar-root [style*="z-index: 9999"] {
        z-index: 9999 !important;
        position: absolute !important;
      }

      .text-gradient {
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

        box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.22);
        transition: all 0.3s ease;

        border-radius: 15px;

        color: var(--text-primary) !important;

        color: var(--text-primary) !important;

        background: linear-gradient(135deg, var(--text-dark), #6D6D6D) !important;
        border: none !important;
        color: white !important;
        transition: all 0.3s ease !important;
      }
      
      .btn-secondary:hover {
        background: linear-gradient(135deg, #5a5a5a, #5c5c5c) !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 4px 8px rgba(109, 109, 109, 0.3) !important;
      }
      
      .btn-outline-primary {
        background: transparent !important;
        border: 2px solid var(--primary-color) !important;
        color: var(--primary-color) !important;
        transition: all 0.3s ease !important;
      }
      
      .btn-outline-primary:hover {
        background: var(--primary-color) !important;
        color: white !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 4px 8px rgba(var(--primary-rgb), 0.3) !important;
      }
      
      /* Shop Styles */
      .balance-display {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .balance-label {
        font-size: 1.1rem;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .category-tabs {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .category-tab {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        color: var(--text-secondary);
        font-weight: 600;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
      }

      .category-tab:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }

      .category-tab.active {
        background: var(--gradient-primary);
        color: white;
        border-color: var(--primary-color);
      }

      .shop-items-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .shop-item-card {
        background: linear-gradient(135deg, var(--darker-bg) 0%, var(--card-bg) 100%);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 1.5rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .shop-item-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .shop-item-card.rare {
        border-color: #4CAF50;
        box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
      }

      .shop-item-card.epic {
        border-color: #9C27B0;
        box-shadow: 0 0 20px rgba(156, 39, 176, 0.3);
      }

      .shop-item-card.legendary {
        border-color: #FF9800;
        box-shadow: 0 0 20px rgba(255, 152, 0, 0.3);
      }

      .item-image {
        text-align: center;
        margin-bottom: 1rem;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .item-name {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        text-align: center;
      }

      .item-description {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        text-align: center;
        min-height: 40px;
      }

      .item-price {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .price-amount {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      .rarity-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        color: white;
        text-transform: uppercase;
      }

      .item-actions {
        text-align: center;
      }

      .btn-buy {
        background: var(--gradient-primary);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        width: 100%;
      }

      .btn-buy:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 72, 72, 0.4);
      }

      .btn-buy:disabled {
        background: var(--text-secondary);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }

      .inventory-item {
        background: linear-gradient(135deg, var(--darker-bg) 0%, var(--card-bg) 100%);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 1rem;
        transition: all 0.3s ease;
        position: relative;
      }

      .inventory-item.equipped {
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(255, 72, 72, 0.3);
      }

      .equipped-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--gradient-primary);
        color: white;
        padding: 0.25rem 0.5rem;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 600;
        z-index: 1;
      }
      
              /* Стили для экипированных предметов в профиле */
        .equipped-items {
          margin-top: 2rem;
        }
        
        .equipped-items-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
          justify-content: center;
        }
        
        .equipped-item-badge {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          background: rgba(255, 72, 72, 0.1);
          border: 1px solid rgba(255, 72, 72, 0.3);
          border-radius: 20px;
          padding: 0.5rem 1rem;
          transition: all 0.3s ease;
        }
        
        .equipped-item-badge:hover {
          background: rgba(255, 72, 72, 0.2);
          transform: translateY(-2px);
          box-shadow: 0 4px 12px rgba(255, 72, 72, 0.3);
        }
        
        .equipped-item-name {
          font-size: 0.8rem;
          font-weight: 600;
          color: var(--text-primary);
        }

        /* Стили для фонов профиля */
        .anime-background {
          position: relative;
          overflow: visible !important;
        }

        /* Убираем overflow hidden с body при применении анимированного фона */
        body.anime-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        body.presidents-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        /* Убираем overflow hidden с html при применении анимированного фона */
        html.anime-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        html.presidents-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        /* Убираем overflow hidden с app-container при применении анимированного фона */
        .app-container.anime-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        .app-container.presidents-background {
          overflow: visible !important;
          overflow-x: auto !important;
          overflow-y: auto !important;
        }

        /* Дополнительные стили для анимированного фона */
        body.anime-background {
          background: none !important;
          background-color: transparent !important;
        }

        body.presidents-background {
          background: none !important;
          background-color: transparent !important;
        }
        




        /* Видео фон для аниме */
        .anime-background-video {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          object-fit: cover;
          opacity: 0.6;
          pointer-events: none;
          filter: brightness(0.9) contrast(1.1);
        }

        /* Видео фон для президентского фона */
        .presidents-background-video {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          object-fit: cover;
          opacity: 0.6;
          pointer-events: none;
          filter: brightness(0.9) contrast(1.1);
        }

        /* Стили для президентского фона */
        .presidents-background {
          position: relative;
          overflow: visible !important;
        }



        /* Убираем основной фон когда применяется анимированный */
        body.anime-background::before {
          display: none !important;
        }

        body.presidents-background::before {
          display: none !important;
        }

        /* Убираем основной фон из app-container когда применяется анимированный */
        body.anime-background .app-container::before {
          display: none !important;
        }

        body.presidents-background .app-container::before {
          display: none !important;
        }
        
        /* Убираем фон app-container когда применяется анимированный */
        .app-container.anime-background::before {
          display: none !important;
        }

        .app-container.presidents-background::before {
          display: none !important;
        }

        /* Рамки профиля */
        .profile-frame-gold {
          border: 3px solid #FFD700 !important;
          box-shadow: 0 0 20px rgba(255, 215, 0, 0.5) !important;
          background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%) !important;
        }

        .profile-frame-crystal {
          border: 3px solid #00FFFF !important;
          box-shadow: 0 0 30px rgba(0, 255, 255, 0.6) !important;
          background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%) !important;
          animation: crystalGlow 2s ease-in-out infinite alternate;
        }

        .profile-frame-legendary {
          border: 3px solid #FF4500 !important;
          box-shadow: 0 0 40px rgba(255, 69, 0, 0.7) !important;
          background: linear-gradient(135deg, rgba(255, 69, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%) !important;
          animation: legendaryPulse 3s ease-in-out infinite;
        }

        /* Стили карточек статистики */
        .stat-card-neon {
          border: 2px solid #00FF00 !important;
          box-shadow: 0 0 15px rgba(0, 255, 0, 0.4) !important;
          background: linear-gradient(135deg, rgba(0, 255, 0, 0.05) 0%, rgba(0, 0, 0, 0.1) 100%) !important;
        }

        .stat-card-metal {
          border: 2px solid #C0C0C0 !important;
          box-shadow: 0 0 20px rgba(192, 192, 192, 0.5) !important;
          background: linear-gradient(135deg, rgba(192, 192, 192, 0.1) 0%, rgba(128, 128, 128, 0.05) 100%) !important;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5) !important;
        }

        .stat-card-holographic {
          border: 2px solid transparent !important;
          background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000) !important;
          background-size: 400% 400% !important;
          animation: holographicShift 4s ease infinite !important;
          box-shadow: 0 0 25px rgba(255, 255, 255, 0.3) !important;
        }

        /* Анимации */
        @keyframes crystalGlow {
          0% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); }
          100% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.8); }
        }

        @keyframes legendaryPulse {
          0% { 
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.7);
            transform: scale(1);
          }
          50% { 
            box-shadow: 0 0 60px rgba(255, 69, 0, 0.9);
            transform: scale(1.02);
          }
          100% { 
            box-shadow: 0 0 40px rgba(255, 69, 0, 0.7);
            transform: scale(1);
          }
        }

        @keyframes holographicShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        /* Составная косметика профиля: фон, аватар и рамка — разные слои. */
        .cosmetic-preview {
          position: relative;
          width: min(100%, 168px);
          aspect-ratio: 16 / 10;
          margin: 0 auto;
          display: grid;
          place-items: center;
          overflow: hidden;
          border: 1px solid var(--card-border);
          border-radius: 14px;
          background: rgba(var(--card-bg-rgb), 0.92);
        }

        .cosmetic-avatar-preview {
          position: relative;
          width: 62px;
          height: 62px;
          display: grid;
          place-items: center;
          border-radius: 50%;
          background: #10141d;
        }

        .cosmetic-avatar-preview img {
          width: 54px;
          height: 54px;
          border-radius: 50%;
          object-fit: cover;
        }

        .avatar-container.avatar-frame-palantir::before,
        .cosmetic-avatar-preview.avatar-frame-palantir::before {
          content: "";
          position: absolute;
          z-index: 2;
          pointer-events: none;
          background: url(/cosmetics/steam-profile-avatar-frame.png) center / 100% 100% no-repeat;
          image-rendering: pixelated;
        }

        .avatar-container.avatar-frame-palantir::before {
          inset: -14px;
        }

        .cosmetic-avatar-preview.avatar-frame-palantir::before {
          inset: -6px;
        }

        .avatar-container.avatar-frame-palantir .avatar-upload-btn {
          z-index: 4;
        }

        .profile-avatar {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .avatar-upload-action {
          margin-top: 22px;
        }

        .avatar-upload-action .avatar-upload-btn {
          position: static;
          width: auto;
          height: 36px;
          min-width: 154px;
          padding: 0 16px;
          gap: 8px;
          border-radius: 999px;
        }

        .cosmetic-preview--background.profile-background-starlight {
          background-color: #d8dbe5;
          background-image: url(/cosmetics/steam-profile-background-poster.jpg);
          background-position: center;
          background-size: cover;
        }

        .cosmetic-preview--background.profile-background-starlight span,
        .cosmetic-preview--background.profile-background-starlight i {
          display: none;
        }

        .profile-background-starlight-video {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          object-fit: cover;
          pointer-events: none;
          background: #d8dbe5 url(/cosmetics/steam-profile-background-poster.jpg) center / cover no-repeat;
        }

        body.profile-background-starlight::after,
        body.profile-background-starlight .app-container::before,
        .app-container.profile-background-starlight::before {
          display: none !important;
        }

        .cosmetic-preview--background span {
          width: 72%;
          height: 38%;
          border: 1px solid rgba(117, 242, 223, 0.5);
          border-radius: 8px;
          background: rgba(12, 19, 39, 0.7);
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
        }

        .cosmetic-preview--background i {
          position: absolute;
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: #d8fff9;
          box-shadow: 28px -17px 0 #a98ae0, -31px 12px 0 #75f2df, 14px 22px 0 #ffffff;
        }

        .profile-background-starlight .profile-header-card {
          border-color: rgba(137, 221, 238, 0.48) !important;
          box-shadow: 0 18px 60px rgba(31, 58, 109, 0.32) !important;
        }

        body.profile-background-starlight .container-fluid .card {
          background: rgba(var(--card-bg-rgb), 0.74) !important;
          backdrop-filter: blur(10px) saturate(1.08);
        }

        body.profile-background-starlight .container-fluid .card .card-body,
        body.profile-background-starlight .container-fluid .card .tab-content {
          background: transparent !important;
        }

        body.profile-background-starlight .container-fluid .card .card-header {
          background: rgba(var(--card-bg-rgb), 0.28) !important;
        }

        body.profile-background-starlight header.MuiAppBar-root {
          background: rgba(var(--card-bg-rgb), 0.78) !important;
          backdrop-filter: blur(12px) saturate(1.08);
        }

        /* Поздние legacy-правила профиля тоже следуют активной теме сайта. */
        html[data-site-theme] .profile-header-card,
        html[data-site-theme] .profile-info-card,
        html[data-site-theme] .profile-tabs-card,
        html[data-site-theme] .profile-invites-card,
        html[data-site-theme] .statistics-card,
        html[data-site-theme] .settings-section {
          border-color: rgba(var(--primary-rgb), 0.3) !important;
        }

        html[data-site-theme] .profile-tabs .nav-link:hover,
        html[data-site-theme] .profile-tabs .nav-link.active,
        html[data-site-theme] .balance-amount,
        html[data-site-theme] .stat-value {
          color: var(--primary-color) !important;
        }

        html[data-site-theme] .profile-tabs .nav-link:hover {
          background: rgba(var(--primary-rgb), 0.08) !important;
        }

        html[data-site-theme] .profile-tabs .nav-link.active,
        html[data-site-theme] .inventory-item.equipped {
          background: rgba(var(--primary-rgb), 0.14) !important;
          border-color: var(--primary-color) !important;
        }

        html[data-site-theme] .profile-tabs .nav-link.active::before {
          background: var(--primary-color) !important;
        }

        html[data-site-theme] .profile-username,
        html[data-site-theme] .level-badge,
        html[data-site-theme] .experience-bar .progress-bar,
        html[data-site-theme] .settings-section .btn-primary {
          background: var(--gradient-primary) !important;
        }

        html[data-site-theme] .profile-username {
          -webkit-background-clip: text !important;
          background-clip: text !important;
          -webkit-text-fill-color: transparent !important;
        }

        html[data-site-theme] .user-avatar-img,
        html[data-site-theme] #defaultAvatar {
          box-shadow: 0 0 24px rgba(var(--primary-rgb), 0.34) !important;
        }

        .shop-header-card {
          background: linear-gradient(135deg, rgba(var(--card-bg-rgb), 0.96), rgba(var(--primary-rgb), 0.09)) !important;
          border-color: rgba(var(--primary-rgb), 0.32) !important;
          box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
        }
    </style>
  </head>
